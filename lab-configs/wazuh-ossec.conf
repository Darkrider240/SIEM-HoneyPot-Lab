<!--
  =============================================================================
  File: wazuh-ossec.conf
  Purpose: Snippet to configure the local Wazuh Agent inside your Kali VM.
           Tells the agent to read and parse the JSON logs produced by Cowrie.
  Target: Append this block inside the <ossec_config> element in:
          /var/ossec/etc/ossec.conf
  =============================================================================
-->

<ossec_config>

  <!-- COWRIE HONEYPOT LOG INGESTION -->
  <!-- 
    NOTE: Depending on whether you ran Cowrie as 'root' or 'kali' user,
    update the <location> path below.
    
    If run as user 'kali':   /home/kali/lab/cowrie/logs/cowrie.json
    If run as user 'root':   /root/lab/cowrie/logs/cowrie.json
  -->
  <localfile>
    <log_format>json</log_format>
    <location>/home/kali/lab/cowrie/logs/cowrie.json</location>
  </localfile>

  <!-- 
    BONUS: SURICATA IDS LOG INGESTION
    Uncomment the block below to also forward Suricata's highly detailed
    threat logs (EVE-JSON) into Wazuh for centralized correlation!
  -->
  <!--
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>
  -->

</ossec_config>
